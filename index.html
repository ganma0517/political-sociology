<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>政治社會學教材資料庫</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1 id="site-title">政治社會學教材資料庫</h1>
      <p id="site-subtitle" class="subtitle"></p>
      <p id="site-intro" class="intro"></p>
    </div>
  </header>

  <main class="wrap">
    <div class="toolbar">
      <input type="search" id="search" placeholder="搜尋標題、主題、標籤…" aria-label="搜尋">
      <div id="filters" class="filters"></div>
    </div>

    <div id="cards" class="cards"></div>
    <p id="empty" class="empty" hidden>找不到符合的教材。</p>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span id="footer-author"></span> · 以 GitHub Pages 建置
    </div>
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>
